name: Linux

on:
  push:
    branches: [main]
    paths:
      - '*.sh'
      - 'cpp/**'
      - 'go/**'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: ./setup.sh
      - name: Run tests, linters and benchmarks
        run: ./check.sh | tee build-linux.log
      - name: Save coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: linux-results
          path: |
            build/linux/reports/*.html
            build/linux/reports/*.css
            build/linux/reports/*.js
            build-linux.log
          if-no-files-found: error
          retention-days: 7
